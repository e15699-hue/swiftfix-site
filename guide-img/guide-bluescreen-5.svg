<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="Noto Sans TC, sans-serif">
<rect width="800" height="450" fill="#f2f5f5"/>
<text x="700" y="30" font-size="20" fill="#8a9ba0">示意圖</text>
<rect x="110" y="110" width="260" height="180" rx="12" fill="#ffffff" stroke="#d5dddd" stroke-width="2"/>
<text x="240" y="160" font-size="28" fill="#013e47" text-anchor="middle">🎮 打遊戲</text>
<text x="240" y="205" font-size="24" fill="#013e47" text-anchor="middle">剪影片時才藍</text>
<text x="240" y="250" font-size="22" fill="#5a6b70" text-anchor="middle">→ 過熱／顯卡／電源</text>
<rect x="430" y="110" width="260" height="180" rx="12" fill="#ffffff" stroke="#d5dddd" stroke-width="2"/>
<text x="560" y="160" font-size="28" fill="#013e47" text-anchor="middle">🕐 一開機就藍</text>
<text x="560" y="205" font-size="24" fill="#013e47" text-anchor="middle">或隨機亂跳</text>
<text x="560" y="250" font-size="22" fill="#5a6b70" text-anchor="middle">→ 記憶體／硬碟／系統檔</text>
<text x="400" y="350" font-size="28" fill="#013e47" text-anchor="middle" font-weight="bold">發生時機，是判斷方向的重要線索</text>
<rect x="0" y="410" width="800" height="40" fill="#013e47"/>
<text x="400" y="437" font-size="22" fill="#ffffff" text-anchor="middle">步驟 5：記下藍屏發生的時機</text>
</svg>
