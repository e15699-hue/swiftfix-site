    <div class="w-full max-w-md">
        <!-- Logo/Header -->
        <div class="flex items-center justify-center gap-3 cursor-pointer group select-none mb-10" onclick="window.location.href='/'">
            <div class="w-14 h-14 bg-brand-gold text-[#0f172a] flex items-center justify-center rounded-tr-2xl rounded-bl-2xl shadow-lg group-hover:scale-110 transition-transform duration-300">
                <i class="fas fa-microchip text-3xl"></i>
            </div>
            <div class="flex flex-col items-start">
                 <span class="text-4xl font-black tracking-tighter text-gray-100 leading-none group-hover:text-brand-gold transition-colors duration-300 italic">SWIFT</span>
                 <span class="bg-brand-gold text-[#0f172a] text-xs md:text-sm font-bold px-2 py-0.5 rounded-md tracking-widest shadow-sm mt-1">電腦到府維修</span>
            </div>
        </div>

        <!-- Query Box -->
        <div class="bg-white/10 backdrop-blur-md rounded-3xl border border-white/20 shadow-2xl p-6 sm:p-8">
            <h1 class="text-xl font-bold mb-6 flex items-center justify-center">
                <i class="fas fa-search-location mr-3 brand-gold"></i> 維修進度即時查詢
            </h1>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-2 ml-1">請輸入您預約時留下的電話號碼</label>
                    <input type="tel" id="phone" placeholder="例如: 0912345678（可含空格或 -）" 
                        class="w-full bg-slate-900 border border-slate-700 rounded-2xl px-5 py-4 text-white placeholder:text-gray-500 focus:outline-none focus:border-brand-gold transition-all text-lg shadow-inner">
                </div>
                <button onclick="doQuery()" id="btn"
                    class="w-full bg-brand-gold hover:bg-[#c4a030] text-slate-900 font-black py-4 rounded-2xl transition shadow-lg flex items-center justify-center text-lg">
                    <i class="fas fa-search mr-2"></i> 立即查詢
                </button>
            </div>

            <!-- Loading Segment -->
            <div id="loading" class="mt-8 hidden text-center">
                <i class="fas fa-circle-notch fa-spin text-3xl brand-gold"></i>
                <p class="mt-2 text-sm text-gray-400">正在連線雲端資料庫...</p>
            </div>

            <!-- Result Segment -->
            <div id="results" class="mt-8 hidden animate-fade-in space-y-4">
                <!-- Dynamically Inserted Items -->
            </div>

            <!-- Empty Segment -->
            <div id="empty" class="mt-8 hidden text-center bg-brand-gold/10 p-5 rounded-2xl border border-brand-gold/20">
                <i class="fas fa-info-circle text-2xl brand-gold mb-2"></i>
                <p class="text-brand-gold font-bold text-sm">找不到這支電話的維修紀錄。</p>
                <p class="text-gray-400 text-xs mt-1 leading-relaxed">請確認輸入的是您送修時留下的電話號碼；<br>若剛送修不久，資料可能還在登記中，<br>直接傳 LINE 問老闆最快。</p>
                <a href="https://line.me/R/ti/p/@077usxwz" target="_blank" class="mt-4 flex items-center justify-center w-full bg-[#00C300] hover:bg-[#00b300] text-white font-bold py-3.5 rounded-2xl transition shadow-lg text-base">
                    <i class="fab fa-line mr-2 text-xl"></i> 一鍵開啟 LINE 客服
                </a>
            </div>

            <!-- Error Segment（逾時／連線失敗：頁內提示＋LINE 出口，不用 alert） -->
            <div id="error" class="mt-8 hidden text-center bg-red-500/10 p-5 rounded-2xl border border-red-500/30">
                <i class="fas fa-exclamation-triangle text-2xl text-red-400 mb-2"></i>
                <p id="errorMsg" class="text-red-300 font-bold text-sm leading-relaxed"></p>
                <p class="text-gray-400 text-xs mt-1 leading-relaxed">可以按查詢再試一次，<br>或直接傳 LINE 問老闆目前的維修進度。</p>
                <a href="https://line.me/R/ti/p/@077usxwz" target="_blank" class="mt-4 flex items-center justify-center w-full bg-[#00C300] hover:bg-[#00b300] text-white font-bold py-3.5 rounded-2xl transition shadow-lg text-base">
                    <i class="fab fa-line mr-2 text-xl"></i> 直接傳 LINE 問進度
                </a>
            </div>
            <!-- Help Links & Home Button -->
            <div class="mt-8">
                <a href="/" class="flex flex-col items-center justify-center w-full bg-slate-800 hover:bg-slate-700 text-white font-medium py-3 rounded-2xl transition border border-white/10 group shadow-lg mb-6">
                    <i class="fas fa-home text-lg mb-1 group-hover:text-brand-gold transition-colors"></i>
                    <span class="text-sm">返回首頁</span>
                </a>
                <div class="pt-6 border-t border-white/10 flex justify-center space-x-4 text-sm text-gray-500">
                    <a href="https://line.me/R/ti/p/@077usxwz" target="_blank" class="hover:text-brand-gold transition"><i class="fab fa-line mr-1"></i>LINE 客服</a>
                </div>
            </div>
        </div>
        <div class="mt-12 text-center text-gray-500 text-xs">
            <p>© 2026 Swift 迅修電腦. 統編 94538172. All rights reserved.</p>
        </div>
    </div>

    <script>
        // --- 設定區 ---
        // 請在此處填入您部署 GAS 得到的「網路應用程式網址」
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzDiaoCACOzF_RvjQIfUErTsADnc7pic2OBNRvMToG4ovR9EBwVeUnLBy1Rae8p-BrT/exec";

        // 轉義 HTML，避免試算表內容被當成 HTML 執行
        function escapeHtml(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // 電話欄按 Enter 直接查詢（手機鍵盤「前往/搜尋」鍵可用）
        document.getElementById('phone').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); doQuery(); }
        });

        // 回頭客：記住上次查詢的電話，開啟頁面自動帶入（僅本機 localStorage，不外傳）
        (function () {
            try {
                const saved = localStorage.getItem('swiftfix_last_phone');
                if (saved) { document.getElementById('phone').value = saved; }
            } catch (e) { /* localStorage 不可用時忽略 */ }
        })();

        async function doQuery() {
            const phoneInput = document.getElementById('phone');
            const resultDiv = document.getElementById('results');
            const emptyDiv = document.getElementById('empty');
            const errorDiv = document.getElementById('error');
            const errorMsg = document.getElementById('errorMsg');
            const loadingDiv = document.getElementById('loading');
            const btn = document.getElementById('btn');
            
            // 回頭客常打空格或連字號（如 0912-345-678）：先去掉再送出，
            // 試算表電話欄一律純數字文字格式，避免「查無資料」假陰性
            const phone = phoneInput.value.trim().replace(/[\s-]/g, '');
            if (!phone) {
                alert('請先輸入電話號碼');
                phoneInput.focus();
                return;
            }

            // 記住這次的電話，下次開頁自動帶入（僅本機 localStorage）
            try { localStorage.setItem('swiftfix_last_phone', phone); } catch (e) { /* 忽略 */ }

            // Reset UI
            resultDiv.classList.add('hidden');
            resultDiv.innerHTML = '';
            emptyDiv.classList.add('hidden');
            errorDiv.classList.add('hidden');
            loadingDiv.classList.remove('hidden');
            btn.disabled = true;

            // GAS 冷啟動或網路卡住時不讓使用者無限轉圈：15 秒逾時
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 15000);

            try {
                const response = await fetch(`${GAS_URL}?phone=${encodeURIComponent(phone)}`, { signal: controller.signal });
                clearTimeout(timer);
                const data = await response.json();

                loadingDiv.classList.add('hidden');
                btn.disabled = false;

                if (data && data.length > 0) {
                    let html = '<div class="text-xs font-bold text-brand-gold mb-3 ml-1">查詢結果：共 ' + data.length + ' 筆（進行中＋已完成）</div>';
                    data.forEach(item => {
                        const isCompleted = item.status === 'completed';
                        const themeColorClass = isCompleted ? 'text-emerald-500' : 'text-brand-gold';
                        const borderColorClass = isCompleted ? 'border-l-emerald-500' : 'border-l-brand-gold';
                        const bgColorClass = isCompleted ? 'bg-emerald-500/10' : 'bg-brand-gold/10';
                        const iconClass = isCompleted ? 'fa-check-circle' : 'fa-tools';
                        
                        html += `
                            <div class="bg-white/5 border border-white/10 p-4 rounded-2xl border-l-4 ${borderColorClass} mb-4">
                                <div class="flex justify-between items-start mb-2 gap-2">
                                    <h4 class="font-bold text-white text-base leading-tight">${escapeHtml(item.description)}</h4>
                                    <span class="text-[10px] text-gray-500 whitespace-nowrap bg-black/30 px-2 py-1 rounded-full">${escapeHtml(item.date)}</span>
                                </div>
                                <div class="${bgColorClass} p-3 rounded-xl">
                                    <p class="${themeColorClass} text-sm font-bold flex items-center">
                                        <i class="fas ${iconClass} mr-2"></i>${escapeHtml(item.progress)}
                                    </p>
                                </div>
                            </div>
                        `;
                    });
                    resultDiv.innerHTML = html;
                    resultDiv.classList.remove('hidden');
                } else {
                    emptyDiv.classList.remove('hidden');
                }
            } catch (error) {
                clearTimeout(timer);
                console.error("Query Error:", error);
                loadingDiv.classList.add('hidden');
                btn.disabled = false;
                // 逾時和一般連線失敗都給頁內提示＋LINE 出口（手機上 alert 體驗差）
                errorMsg.textContent = (error && error.name === 'AbortError')
                    ? '查詢逾時（超過 15 秒沒有回應），可能是雲端服務剛睡醒。'
                    : '連線雲端發生錯誤，請確認網路連線。';
                errorDiv.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
